<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070d">
  <title>李立浩 - 把 AI 能力做成可用产品的人</title>
  <meta name="description" content="李立浩，AI 产品经理。关注真实需求、产品落地与 AI 带来的新机会。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--white:#f6f8fb;--muted:rgba(235,241,247,.64);--line:rgba(255,255,255,.16);--cyan:#a9d7ff}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03070d;color:var(--white);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}::selection{background:rgba(169,215,255,.25);color:#fff}a{color:inherit;text-decoration:none}
    .page{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;isolation:isolate;background:#07111c}.space-bg{position:absolute;inset:0;z-index:-5;background:url("space-hero.png") center/cover no-repeat}.space-bg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 8% 55%,rgba(42,91,132,.26),transparent 38%),radial-gradient(circle at 48% 24%,rgba(37,70,105,.18),transparent 36%)}.space-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,10,18,.48) 0%,rgba(3,10,18,.24) 38%,rgba(3,10,18,.06) 70%,rgba(3,10,18,.12) 100%),linear-gradient(180deg,rgba(1,5,9,.02),rgba(1,5,9,.18))}.stars{position:absolute;inset:0;z-index:-4;pointer-events:none;background-image:radial-gradient(circle at 22% 28%,rgba(255,255,255,.65) 0 1px,transparent 1.5px),radial-gradient(circle at 44% 66%,rgba(169,215,255,.58) 0 1px,transparent 1.4px),radial-gradient(circle at 63% 24%,rgba(255,255,255,.48) 0 1px,transparent 1.5px);background-size:190px 170px,240px 210px,310px 260px;opacity:.68}
    .robot-stage{position:absolute;z-index:auto;inset:0 0 0 43%;overflow:hidden;pointer-events:none;mask-image:linear-gradient(90deg,transparent 0%,#000 25%,#000 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 25%,#000 100%)}.robot-stage::after{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(90deg,rgba(7,17,28,.86),transparent 31%),linear-gradient(180deg,transparent 70%,rgba(7,17,28,.22));pointer-events:none}.robot-video{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:right bottom;opacity:1;filter:none;mix-blend-mode:normal;background:transparent}
    .header{position:absolute;z-index:10;inset:0 0 auto;padding:clamp(18px,2.3vw,30px) clamp(22px,4vw,62px);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-size:clamp(18px,1.7vw,24px);font-weight:500;letter-spacing:-.035em}.brand-mark{color:var(--cyan);font-size:25px;line-height:1}.nav{display:flex;align-items:center;gap:28px;color:rgba(255,255,255,.7);font-size:13px}.nav a{transition:color .8s}.nav a:hover{color:#fff}.status{display:flex;align-items:center;gap:8px}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#9de4b2;box-shadow:0 0 14px rgba(157,228,178,.7)}
    .content{position:relative;z-index:4;width:min(92vw,1280px);height:100%;margin:auto;padding:clamp(88px,11vh,124px) 0 clamp(24px,4vh,46px);display:flex;flex-direction:column;justify-content:center}.copy{width:min(620px,53vw);margin-top:-1vh}.eyebrow{margin:0 0 clamp(13px,2vh,22px);color:var(--cyan);font-size:10px;letter-spacing:.22em;text-transform:uppercase}h1{margin:0 0 clamp(16px,2.6vh,28px);font-size:clamp(45px,5.4vw,78px);font-weight:400;line-height:1.02;letter-spacing:-.058em;text-wrap:balance}.intro{max-width:540px;margin:0;color:var(--muted);font-size:clamp(14px,1.3vw,18px);line-height:1.72}.actions{margin-top:clamp(20px,3vh,30px);display:flex;align-items:center;gap:9px;flex-wrap:wrap}.button{min-height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.93);color:#07111b;font-size:11px;font-weight:500;transition:transform .8s,background .8s}.button:hover{transform:translateY(-2px);background:#fff}.button.ghost{color:#fff;background:rgba(5,12,21,.34);backdrop-filter:blur(12px)}.button.ghost:hover{background:rgba(255,255,255,.1)}.button.upcoming{color:rgba(255,255,255,.52);background:rgba(5,12,21,.22);cursor:default}.button.upcoming:hover{transform:none;background:rgba(5,12,21,.22)}
    .fade-in{opacity:0;transform:translateY(16px);animation:enter 2.8s ease forwards}.fade-in.delay-1{animation-delay:.32s}.fade-in.delay-2{animation-delay:.64s}.fade-in.delay-3{animation-delay:.96s}@keyframes enter{to{opacity:1;transform:none}}
    @media(max-width:800px){.page{min-height:520px}.header{padding:18px 20px}.nav{gap:0}.status{font-size:10px}.space-bg{background-position:62% center}.robot-stage{inset:26% -18% -8% 16%;opacity:.62;mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 100%)}.content{width:calc(100% - 40px);padding:78px 0 20px;justify-content:flex-start}.copy{width:100%;margin-top:8vh}h1{max-width:560px;font-size:clamp(42px,12vw,62px)}.intro{max-width:450px;font-size:14px}}
    @media(max-width:520px){.status span{display:none}.copy{margin-top:5vh}h1{font-size:clamp(38px,11vw,52px)}.intro{max-width:340px;line-height:1.58}.actions{margin-top:20px}.button{min-height:36px;padding:0 12px;font-size:10px}}
    @media(max-height:650px) and (min-width:801px){.copy{margin-top:-4vh}h1{font-size:clamp(42px,5vw,66px)}.intro{line-height:1.55}.actions{margin-top:18px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>

    <header class="header"><a class="brand" href="#home"><span>李立浩</span><span class="brand-mark">✱</span></a><nav class="nav" aria-label="主导航"><a class="status" href="https://github.com/xingxing-del" target="_blank" rel="noreferrer"><span>GitHub</span></a><a href="/articles">文章</a><a href="mailto:lilihao154@gmail.com">邮箱</a></nav></header>
    <section class="content">
      <div class="copy"><h1 class="fade-in delay-1">把 AI 能力<br>做成可用产品的人</h1><p class="intro fade-in delay-2">我是李立浩，一名 AI 产品经理。关注真实需求、产品落地，以及技术如何转化为用户愿意持续使用的产品。</p><div class="actions fade-in delay-3"><a class="button" href="https://github.com/xingxing-del" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a><a class="button" href="/articles">文章 <span aria-hidden="true">↗</span></a><a class="button" href="mailto:lilihao154@gmail.com">lilihao154@gmail.com <span aria-hidden="true">↗</span></a></div></div>
    </section>
  </main>
</body>
</html>
